
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quojo Phages Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #172b4d;
    }
    .container {
      max-width: 420px;
      margin: 50px auto;
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 3px 15px #0001;
    }
    h1 { color: #f36b21; text-align: center; }
    input, button {
      width: 100%;
      padding: 14px;
      margin: 9px 0;
      box-sizing: border-box;
      border-radius: 7px;
      font-size: 16px;
    }
    input { border: 1px solid #ccc; }
    button {
      border: 0;
      background: #f36b21;
      color: white;
      font-weight: bold;
    }
    #message { text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Quojo Phages</h1>
    <h2>Owner Admin Login</h2>
    <input id="email" type="email" placeholder="Owner email">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Sign In</button>
    <p id="message"></p>
  </div>

  <script>
    const SUPABASE_URL =
      "https://rqrrtyjdvcarllaurowr.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_T0JI3xNH-uCg0pGhLBxxyg_KpSJzVPb";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      message.textContent = "Signing in...";

      const { error } = await client.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        message.textContent = error.message;
        return;
      }

      message.textContent =
        "Login successful. Owner access must still be verified.";
    }
  </script>
</body>
</html>
